
# Nome da aplicação
spring.application.name=stockflow

# Configuração do banco de dados TiDB Cloud
spring.datasource.url=jdbc:mysql://gateway01.sa-east-1.prod.aws.tidbcloud.com:4000/stockflow?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=86400000

# Evita consultas ao banco durante a serialização das respostas
spring.jpa.open-in-view=false

# Limite para envio de foto de perfil
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
